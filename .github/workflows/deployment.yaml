name: Deployment workflow
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone code
        uses: actions/checkout@v7
      - name: Download node
        uses: actions/setup-node@v7   
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Build app
        run: npm run build